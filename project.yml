name: IdFit
options:
  bundleIdPrefix: net.shershnev
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  IdFit:
    type: application
    platform: macOS
    sources:
      - path: Sources/IdFit
        excludes: [Resources]
      - path: Sources/IdFit/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Sources/IdFit/Info.plist
      properties:
        CFBundleName: ID Fit
        CFBundleDisplayName: ID Fit
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
        # Lets Finder offer ID Fit under "Open With" for folders, and lets the
        # command line tool hand a folder over with `open -b`.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder of Scans
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSServices:
          # Accepts scans as well as folders: inside an open folder there is
          # nothing to right-click but the files, and any one of them
          # identifies the folder to open.
          - NSMenuItem:
              default: Open Folder in ID Fit
            NSMessage: openFolder
            NSPortName: ID Fit
            NSSendFileTypes: [public.folder, public.image, com.adobe.pdf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.shershnev.id-fit
        ENABLE_HARDENED_RUNTIME: NO
  IdFitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/IdFitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: IdFit
schemes:
  IdFit:
    build:
      targets:
        IdFit: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [IdFitTests]
