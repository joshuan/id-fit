name: Release

# Runs when a release is published on GitHub — from the Releases page or from
# `gh release create`. The release already exists by then, so this builds its
# tag and attaches the build to it.
#
# Publishing is the only trigger. Pushing a tag on its own releases nothing,
# which also keeps a tag created by the Releases page from starting this
# workflow twice.
#
# Without signing secrets the build is ad-hoc signed, which is installable
# through install.sh (see the notes this workflow appends). Add the secrets
# listed under "Sign with Developer ID" and the same workflow starts producing
# a notarized build instead — nothing else changes.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      # Secrets cannot be read from a step's `if:`, so their presence is turned
      # into an output first.
      - name: Look for signing secrets
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Developer ID secrets found — publishing an ad-hoc signed build."
          fi

      # Needs MACOS_CERTIFICATE_P12 (base64 of the exported Developer ID
      # Application .p12), MACOS_CERTIFICATE_PASSWORD and MACOS_SIGN_IDENTITY
      # (e.g. "Developer ID Application: Name (TEAMID)").
      - name: Sign with Developer ID
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.available == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
          # A secure timestamp needs a real identity, so ad-hoc builds omit it.
          CODESIGN_FLAGS: ${{ steps.signing.outputs.available == 'true' && '--options runtime --timestamp' || '--options runtime' }}
        run: |
          # The tag is the version: v1.2.3 ships as 1.2.3.
          make package \
            VERSION="${TAG#v}" \
            BUILD="${{ github.run_number }}" \
            SIGN_IDENTITY="$SIGN_IDENTITY" \
            CODESIGN_FLAGS="$CODESIGN_FLAGS"

      # Needs AC_API_KEY_P8 (contents of the App Store Connect .p8 key),
      # AC_API_KEY_ID and AC_API_ISSUER_ID.
      - name: Notarize and staple
        if: steps.signing.outputs.available == 'true'
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$AC_API_KEY_P8" > "$key"
          xcrun notarytool submit dist/IdFit.zip \
            --key "$key" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait
          # The ticket is stapled to the bundle, so the archive has to be built
          # again from the stapled app.
          xcrun stapler staple dist/IdFit.app
          rm -f "$key" dist/IdFit.zip
          ditto -c -k --keepParent dist/IdFit.app dist/IdFit.zip
          xcrun stapler validate dist/IdFit.app

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          NOTARIZED: ${{ steps.signing.outputs.available }}
        run: |
          # --clobber so re-running the workflow replaces the asset instead of
          # failing on the one already there.
          gh release upload "$TAG" dist/IdFit.zip --clobber

          # The notes are the author's; this only adds the section telling
          # people how to install what was just attached.
          notes="$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --json body --jq '.body // ""' > "$notes"
          if grep -q '^## Install' "$notes"; then
            echo "The notes already carry install instructions — leaving them as they are."
            exit 0
          fi
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            if [ "$NOTARIZED" = "true" ]; then
              echo "Or download \`IdFit.zip\` below, unpack it and drag \`IdFit.app\` into \`/Applications\`."
            else
              echo "Or download \`IdFit.zip\` below and drag \`IdFit.app\` into \`/Applications\`. This build is signed ad-hoc rather than notarized by Apple, so opening it that way is refused the first time: go to **System Settings → Privacy & Security**, find the message about ID Fit and press **Open Anyway**. The command above installs without that step."
            fi
            echo
            echo "Requires macOS 15 or later."
          } >> "$notes"
          gh release edit "$TAG" --notes-file "$notes"
